  </g><g class="molecule-core"><circle cx="30" cy="30" r="9" fill="#88d0e9" opacity=".2"/><circle cx="30" cy="30" r="5.2" fill="#239bc8"/><circle cx="28.6" cy="28.4" r="1.4" fill="#081a32" opacity=".9"/></g>
